{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card mx-auto text-center" style="max-width: 560px">
  <div class="card-body p-5">
    <i class="bi bi-{{ icon }} text-sta" style="font-size:3.5rem"></i>
    <h1 class="h4 mt-3">{{ title }}</h1>
    <p class="text-secondary" data-i18n="soon.text">บริการนี้กำลังจัดทำ จะเปิดให้ใช้งานเร็ว ๆ นี้</p>
    <a class="btn btn-sta" href="{{ url_for('public.home') }}" data-i18n="soon.back">กลับหน้าหลัก</a>
  </div>
</div>
{% endblock %}
