{% extends "base.html" %}
{% block title %}เช็กชื่อ{% endblock %}
{% block content %}
<div class="card mx-auto text-center" style="max-width:460px"><div class="card-body p-4">
  <i class="bi bi-{{ 'check-circle-fill text-success' if cls == 'success' else ('info-circle-fill text-info' if cls == 'info' else 'x-circle-fill text-danger') }}" style="font-size:3.5rem"></i>
  <p class="lead mt-3">{{ msg }}</p>
  <a class="btn btn-sta" href="{{ url_for('activities.my') }}">ดูชั่วโมงกิจกรรมของฉัน</a>
</div></div>
{% endblock %}
